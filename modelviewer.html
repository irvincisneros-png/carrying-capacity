<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrying Capacity · Model Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc0e0; font: 12px/1.3 system-ui, sans-serif; }
      #app, #app canvas { display: block; width: 100%; height: 100%; }
      .lbl { position: absolute; transform: translate(-50%, -100%); color: #2a1e16; background: rgba(255, 248, 235, 0.82); padding: 1px 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; font-weight: 600; }
      #stats { position: absolute; left: 8px; bottom: 8px; margin: 0; max-height: 45vh; overflow: auto; background: rgba(255, 248, 235, 0.85); padding: 6px 8px; border-radius: 6px; font: 11px/1.25 ui-monospace, monospace; display: none; }
      body.showstats #stats { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <pre id="stats"></pre>
    <script type="module" src="/src/render/models/viewer.ts"></script>
  </body>
</html>
